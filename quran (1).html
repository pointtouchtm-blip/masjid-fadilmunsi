      '<div class="tabs" role="tablist"><button role="tab" data-m="read" aria-selected="' + (mode === 'read') + '">পড়ুন</button><button role="tab" data-m="audio" aria-selected="' + (mode === 'audio') + '">শুনুন</button></div>' +
      '<button class="last" id="lastBtn" type="button"></button>' +
      '<input class="search" id="q" type="search" placeholder="সূরার নাম বা নম্বর খুঁজুন" aria-label="সূরা খুঁজুন">' +
      '<ul class="list" id="list"></ul>' +
      '<div class="foot">কুরআনের আরবি টেক্সট ও তিলাওয়াত: <a href="https://alquran.cloud" target="_blank" rel="noopener">Islamic Network (alquran.cloud)</a>। অডিও শুনতে ইন্টারনেট লাগবে। কোনো ভুল চোখে পড়লে ইমাম সাহেবকে জানান।</div>';
    app.innerHTML = h;
    var ul = $('list'), s = '';
    for (var i = 1; i <= 114; i++) s += '<li class="row" data-n="' + i + '" data-s="' + (i + ' ' + NAMES[i - 1] + ' ' + AR[i - 1]).toLowerCase() + '"><span class="no">' + bn(i) + '</span><button class="main" type="button" data-open="' + i + '"><div class="bn">' + NAMES[i - 1] + '</div><div class="mt">' + bn(CNT[i - 1]) + ' আয়াত</div></button><span class="ar">' + AR[i - 1] + '</span><button class="pbtn" type="button" data-play="' + i + '" aria-label="সূরা ' + NAMES[i - 1] + ' শুনুন">' + PLAY_SVG + '</button></li>';
    ul.innerHTML = s; mark();
    var ln = parseInt(ls('qlast') || '0', 10);
    if (ln > 0 && mode === 'read') { var lb = $('lastBtn'); lb.style.display = 'block'; lb.textContent = 'শেষ পড়া: সূরা ' + NAMES[ln - 1] + ' থেকে চালিয়ে যান'; lb.onclick = function () { location.hash = '#s' + ln; }; }
    $('q').addEventListener('input', function () {
      var t = this.value.trim().toLowerCase().replace(/[০-৯]/g, function (d) { return BN.indexOf(d); }), rows = ul.children;
      for (var k = 0; k < rows.length; k++) rows[k].style.display = !t || rows[k].dataset.s.indexOf(t) > -1 ? '' : 'none';
    });
    app.querySelector('.tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) location.hash = b.dataset.m === 'audio' ? '#audio' : '#'; });
    ul.addEventListener('click', function (e) {
      var p = e.target.closest('[data-play]'), o = e.target.closest('[data-open]');
      if (p) playSurah(+p.dataset.play);
      else if (o) { if (mode === 'audio') playSurah(+o.dataset.open); else location.hash = '#s' + o.dataset.open; }
    });
  }

  // ---------- reader ----------
  function renderReader(n) {
    mode = 'read'; ls('qlast', n);
    document.title = 'সূরা ' + NAMES[n - 1] + ' — কুরআন';
    $('barTitle').textContent = 'সূরা ' + NAMES[n - 1]; $('back').href = '#'; $('back').textContent = '← সূরা তালিকা';
    app.innerHTML = '<div class="rd"><div class="rd-head"><div class="ar">سورة ' + AR[n - 1] + '</div><div class="bn">সূরা ' + NAMES[n - 1] + ' · ' + bn(CNT[n - 1]) + ' আয়াত</div></div>' +
      '<div class="tools"><button type="button" id="rdPlay">▶ শুনুন</button><button type="button" id="szM" aria-label="আরবি ছোট">A−</button><button type="button" id="szP" aria-label="আরবি বড়">A+</button></div>' +
      '<div id="rdBody"><div class="msg">লোড হচ্ছে…</div></div>' +
      '<div class="nav2">' + (n > 1 ? '<button class="btn" id="prevS" type="button">← আগের সূরা</button>' : '<span></span>') + (n < 114 ? '<button class="btn fill" id="nextS" type="button">পরের সূরা →</button>' : '<span></span>') + '</div>' +
      '<div class="foot" id="rdFoot">আরবি টেক্সট: Islamic Network (alquran.cloud)।</div></div>';
    var size = parseInt(ls('qsize') || '30', 10); document.documentElement.style.setProperty('--ar-size', size + 'px');
    function sz(d) { size = Math.max(22, Math.min(54, size + d)); ls('qsize', size); document.documentElement.style.setProperty('--ar-size', size + 'px'); }
    $('szP').onclick = function () { sz(4); }; $('szM').onclick = function () { sz(-4); };
    $('rdPlay').onclick = function () { playSurah(n); };
    if ($('prevS')) $('prevS').onclick = function () { location.hash = '#s' + (n - 1); window.scrollTo(0, 0); };
    if ($('nextS')) $('nextS').onclick = function () { location.hash = '#s' + (n + 1); window.scrollTo(0, 0); };
    function show(d) {
      var ar = d.data[0].ayahs, bnA = d.data[1] ? d.data[1].ayahs : [], h = '';
      if (n !== 1 && n !== 9) h += '<div class="bism">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>';
      for (var i = 0; i < ar.length; i++) {
        var a = ar[i].text;
        if (i === 0 && n !== 1 && n !== 9) { var w = a.split(' '); if (w.length > 4) a = w.slice(4).join(' '); }
        h += '<div class="ay"><span class="n">' + bn(ar[i].numberInSurah) + '</span><div class="a" lang="ar">' + esc(a) + '</div>' + (bnA[i] ? '<p class="t">' + esc(bnA[i].text) + '</p>' : '') + '</div>';
      }
      $('rdBody').innerHTML = h;
      var tn = d.data[1] && d.data[1].edition && d.data[1].edition.name; if (tn) $('rdFoot').innerHTML += ' বাংলা অনুবাদ: ' + esc(tn) + '।';
      $('rdFoot').innerHTML += ' পড়ার সময় কোনো ভুল চোখে পড়লে ইমাম সাহেবকে জানান।';
    }
    function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    var key = 'qs_' + n, cached = ls(key);
    if (cached) { try { show(JSON.parse(cached)); } catch (e) { cached = null; } }
    if (!cached) fetch('https://api.alquran.cloud/v1/surah/' + n + '/editions/quran-uthmani,bn.bengali')
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) { if (!d || !d.data || !d.data[0]) throw 0; if (location.hash !== '#s' + n) return; show(d); try { var j = JSON.stringify(d); if (j.length < 400000) ls(key, j); } catch (e) {} })
      .catch(function () { if (location.hash !== '#s' + n) return; $('rdBody').innerHTML = '<div class="msg">লোড করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।<br><button class="btn" type="button" id="retry">আবার চেষ্টা করুন</button></div>'; $('retry').onclick = function () { renderReader(n); }; });
  }

  function route() {
    var h = location.hash || '', m = /^#s(\d{1,3})$/.exec(h);
    if (m && +m[1] >= 1 && +m[1] <= 114) { renderReader(+m[1]); window.scrollTo(0, 0); }
    else { mode = h === '#audio' ? 'audio' : 'read'; renderList(); }
  }
  window.addEventListener('hashchange', route); route();
})();
</script>
</body>
</html>
