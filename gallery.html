<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ছবির গ্যালারি — ফাদিলমুন্সী বাড়ি জামে মসজিদ</title>
<meta name="theme-color" content="#025054">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&family=Amiri:wght@400;700&display=swap">
<style>
:root { --bg:#f3f7f4; --surface:#fff; --fg:#14281f; --muted:#55695f; --line:#d6e1d9; --accent:#16694e; --gold:#8f6a14; --hl:#e4f1ea; --on-accent:#fff; --warn:#8a4b00; --warn-bg:#fff3dc;
  --font-display:"Tiro Bangla","Noto Serif Bengali",serif; --font-body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif; --font-ar:"Amiri","Scheherazade New","Noto Naskh Arabic",serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#0c1713; --surface:#13241d; --fg:#e6efe9; --muted:#9db3a7; --line:#244034; --accent:#55c79b; --gold:#dcb85c; --hl:#1a3329; --on-accent:#0c1713; --warn:#f0c987; --warn-bg:#3a2d10; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:17px; line-height:1.7; padding-bottom:calc(36px + env(safe-area-inset-bottom)); }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-left)); }
.bar a.back { border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; text-decoration: none; font-weight: 600; font-size: 15px; background: var(--surface); white-space: nowrap; }
.bar .tt { font-family: var(--font-display); font-size: 20px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-left)) 0; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 6px 0 4px; }
.sub { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
.note { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--gold); border-radius: 12px; padding: 10px 14px; font-size: 15px; margin: 10px 0; }
.note.ok { background: var(--hl); color: var(--fg); border-color: var(--line); }
.books { display: grid; gap: 10px; margin-top: 12px; }
.book { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.book .n { flex: 1; min-width: 0; }
.book .bn { font-weight: 700; font-size: 18px; line-height: 1.35; }
.book .mt { color: var(--muted); font-size: 13.5px; }
.book .ar { font-family: var(--font-ar); font-size: 24px; color: var(--accent); flex: none; direction: rtl; }
.chip { display: inline-block; font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; margin-right: 4px; color: var(--muted); }
.chip.on { border-color: var(--accent); color: var(--accent); }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.ctl .grow { flex: 1; min-width: 140px; }
.ctl input, .ctl select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; width: 100%; }
.btn { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
.btn.fill { background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .45; cursor: default; }
.sec { font-family: var(--font-display); font-size: 21px; text-align: center; margin: 14px 0 6px; line-height: 1.5; }
.hd { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 10px; margin-bottom: 12px; }
.hd .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.hd .no { font-weight: 700; color: var(--gold); font-size: 14.5px; }
.hd .ar { font-family: var(--font-ar); font-size: var(--ar-size, 26px); line-height: 2.1; direction: rtl; text-align: right; margin: 4px 0; }
.hd .t { margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line); white-space: pre-line; }
.hd .gr { display: inline-block; font-size: 13.5px; font-weight: 600; border-radius: 999px; padding: 1px 12px; border: 1px solid var(--line); margin: 8px 6px 0 0; }
.gr.s { color: var(--accent); border-color: var(--accent); }
.gr.h { color: var(--gold); border-color: var(--gold); }
.gr.d, .gr.m { color: #b3261e; border-color: #b3261e; }
.hd .src { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.hd .act { display: flex; gap: 8px; margin-top: 8px; }
.hd .act button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 14px; font-size: 14px; cursor: pointer; color: var(--muted); }
.msg { text-align: center; padding: 28px 12px; color: var(--muted); }
.foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
.tools { display: flex; gap: 8px; justify-content: center; margin: 6px 0 10px; }
.tools button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-weight: 600; }

.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{cursor:pointer;font-weight:700;padding:12px 14px;list-style:none;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";margin-left:auto;color:var(--gold);font-size:20px}
details[open] summary::after{content:"−"}
details[open] summary{border-bottom:1px solid var(--line)}
.body{padding:8px 14px 12px}
.body p{margin:8px 0}.body ul,.body ol{padding-left:22px;margin:8px 0}.body li{margin:4px 0}
.body ol.st{list-style:none;padding:0}
.body ol.st li{position:relative;padding-left:42px;margin:10px 0;min-height:30px}
.body ol.st li::before{counter-increment:s;content:attr(data-n);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.dua{background:var(--hl);border-radius:10px;padding:10px 12px;margin:10px 0}
.dua .ar{font-family:var(--font-ar);font-size:24px;line-height:2.1;direction:rtl;text-align:right}
.dua .tr{color:var(--fg);margin-top:2px}.dua .ti{color:var(--gold);font-weight:700;font-size:14px}
.draft{background:var(--warn-bg);color:var(--warn);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:15px;margin:6px 0 12px}
.vok{background:var(--hl);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;margin:6px 0 12px}
b.k{color:var(--gold)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid button{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left}
.grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.grid span{display:block;padding:6px 10px 8px;font-size:14.5px;line-height:1.4}
.grid .wide{grid-column:1/-1}.grid .wide img{aspect-ratio:2/1}
.sl{position:relative;aspect-ratio:3/2;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;margin-bottom:12px;cursor:pointer}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
.sl img.on{opacity:1}
.sl .cp{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 8px;color:#fff;font-size:15px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.sl .dt{position:absolute;right:10px;bottom:10px;display:flex;gap:5px}.sl .dt i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}.sl .dt i.on{background:#fff}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;touch-action:pan-y}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:78vh;object-fit:contain}
.lb .cap{color:#fff;padding:10px 16px;text-align:center;font-size:16px}
.lb button{position:absolute;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:24px;cursor:pointer}
.lb .x{top:max(12px,env(safe-area-inset-top));right:12px}.lb .pv{left:8px;top:50%}.lb .nx{right:8px;top:50%}
</style>
</head>
<body>
<div class="bar"><a class="back" id="back" href="index.html">← হোম</a><span class="tt">ছবির গ্যালারি</span></div>
<main class="wrap" id="app"></main>
<script>
(function(){
// নতুন ছবি যোগ করতে gallery/ ফোল্ডারে ছবি (masjid-05.jpg) ও ছোট ছবি (masjid-05-t.jpg) দিন, তারপর নিচে এক লাইন যোগ করুন।
var PHOTOS=[
 {f:'masjid-01',c:'মসজিদের সামনের দৃশ্য'},
 {f:'masjid-02',c:'নামাজের সময়সূচী বোর্ড'},
 {f:'masjid-03',c:'মসজিদের ভেতরে জামাত'},
 {f:'masjid-04',c:'মিহরাব ও মুসল্লিগণ'}
];
var BN='০১২৩৪৫৬৭৮৯';function bn(n){return String(n).replace(/\d/g,function(d){return BN[d]})}
var app=document.getElementById('app'),cur=0,tx=null;
app.innerHTML='<h1>ছবির গ্যালারি</h1><p class="sub">ছবিতে চাপ দিয়ে বড় করে দেখুন। ডানে-বামে টেনে পরের ছবি দেখুন।</p><div class="sl" id="sl" role="button" tabindex="0" aria-label="ছবি বড় করে দেখুন">'+PHOTOS.map(function(p,i){return '<img src="gallery/'+p.f+'.jpg" alt="'+p.c+'" class="'+(i===0?'on':'')+'">'}).join('')+'<div class="cp" id="slc"></div><div class="dt" id="sdt">'+PHOTOS.map(function(){return '<i></i>'}).join('')+'</div></div><div class="grid" id="g">'+
PHOTOS.map(function(p,i){return '<button type="button" data-i="'+i+'"><img loading="'+(i<2?'eager':'lazy')+'" src="gallery/'+p.f+'-t.jpg" alt="'+p.c+'"><span>'+p.c+'</span></button>'}).join('')+'</div>'+
'<div class="foot">ছবি: ফাদিলমুন্সী বাড়ি জামে মসজিদ।</div>'+
'<div class="lb" id="lb" role="dialog" aria-modal="true"><button class="x" id="lx" aria-label="বন্ধ">✕</button><button class="pv" id="lp" aria-label="আগের">‹</button><img id="li" alt=""><div class="cap" id="lc"></div><button class="nx" id="ln" aria-label="পরের">›</button></div>';
var lb=document.getElementById('lb'),li=document.getElementById('li'),lc=document.getElementById('lc');
function show(i){cur=(i+PHOTOS.length)%PHOTOS.length;li.src='gallery/'+PHOTOS[cur].f+'.jpg';li.alt=PHOTOS[cur].c;lc.textContent=PHOTOS[cur].c+' ('+bn(cur+1)+'/'+bn(PHOTOS.length)+')';lb.classList.add('on');document.body.style.overflow='hidden'}
function hide(){lb.classList.remove('on');document.body.style.overflow=''}
document.getElementById('g').addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(b)show(+b.dataset.i)});
var SL_MS=2000,si=0,st=null,sl=document.getElementById('sl'),sim=sl.querySelectorAll('img'),sdt=sl.querySelectorAll('.dt i'),slc=document.getElementById('slc');
function paint(){for(var k=0;k<sim.length;k++){sim[k].classList.toggle('on',k===si);sdt[k].classList.toggle('on',k===si)}slc.textContent=PHOTOS[si].c}
function tick(){si=(si+1)%PHOTOS.length;paint()}
function play(){stop();if(PHOTOS.length>1&&!document.hidden&&!lb.classList.contains('on'))st=setInterval(tick,SL_MS)}
function stop(){if(st){clearInterval(st);st=null}}
paint();play();
document.addEventListener('visibilitychange',function(){document.hidden?stop():play()});
sl.addEventListener('click',function(){show(si)});
sl.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();show(si)}});
var _show=show,_hide=hide;show=function(i){stop();_show(i)};hide=function(){_hide();play()};
document.getElementById('lx').onclick=hide;document.getElementById('lp').onclick=function(){show(cur-1)};document.getElementById('ln').onclick=function(){show(cur+1)};
lb.addEventListener('click',function(e){if(e.target===lb)hide()});
lb.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(tx===null)return;var d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>50)show(cur+(d<0?1:-1))});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')hide();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
document.getElementById('back').addEventListener('click',function(e){e.preventDefault();if(lb.classList.contains('on')){hide();return}
 var same=false;try{same=!!document.referrer&&new URL(document.referrer).origin===location.origin&&!/\/(hadith|quran|bishesh|gallery)\.html/.test(document.referrer)}catch(x){}
 if(same)history.back();else location.href='index.html'});
})();
</script>
</body>
</html>
