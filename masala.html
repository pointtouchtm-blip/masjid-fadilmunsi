      a: 'ফজর: সুবহে সাদিক থেকে সূর্য ওঠার আগ পর্যন্ত।\nযোহর: সূর্য ঢলার পর থেকে আসরের সময় শুরুর আগ পর্যন্ত।\nআসর: হানাফি মতে প্রতিটি বস্তুর ছায়া (দুপুরের আসল ছায়া বাদে) দ্বিগুণ হওয়ার পর থেকে সূর্যাস্তের আগ পর্যন্ত।\nমাগরিব: সূর্যাস্তের পর থেকে পশ্চিম আকাশের আভা থাকা পর্যন্ত।\nএশা: মাগরিবের সময় শেষ হওয়ার পর থেকে সুবহে সাদিকের আগ পর্যন্ত।\nনির্ভুল সময়ের জন্য মসজিদের সময়সূচি দেখুন।' },

    { c: 'নামাজ', q: 'দেরিতে এসে জামাতের কিছু রাকাত না পেলে কী করবেন?',

    { c: 'অজু-গোসল', q: 'গোসলের ফরজ কয়টি এবং কখন গোসল ফরজ হয়?',

    { c: 'অজু-গোসল', q: 'কখন তায়াম্মুম করা যায়?',

    { c: 'অজু-গোসল', q: 'অজু ছাড়া কুরআন ছোঁয়া যাবে কি?',

      a: 'নিয়ত মনের ইচ্ছা। রমযানের রোজার নিয়ত রাতে করা উত্তম। রাতে না করলে সুবহে সাদিকের পর কিছু না খেয়ে থাকলে দ্বিপ্রহরের (সূর্য ঢলার) আগ পর্যন্ত নিয়ত করা যায়। মুখে বলা জরুরি নয়।' },
    { c: 'রোজা', q: 'কী কী কারণে রোজা ভাঙে? কাযা ও কাফফারা কখন?',
      a: 'খাওয়া, পান করা, সহবাস ও ইচ্ছাকৃত মুখভরে বমি করলে রোজা ভাঙে।\nশুধু কাযা: রোজা রেখে অসুস্থতা বা সফরের মতো ওজরে ভাঙলে, অথবা কুলি করার সময় অনিচ্ছায় পানি গলায় চলে গেলে একটি রোজা কাযা করতে হয়। অন্য জটিল ক্ষেত্রে (যেমন ওষুধ, ইনজেকশন) আলেমের কাছে জিজ্ঞাসা করুন।\nকাযা ও কাফফারা দুটোই: রমযানের রোজা রেখে কোনো ওজর ছাড়া ইচ্ছা করে পানাহার বা সহবাস করলে। কাফফারা হলো একটানা ৬০টি রোজা রাখা (মাঝে ছুটে গেলে আবার নতুন করে শুরু)। তা না পারলে ৬০ জন মিসকিনকে দুই বেলা পেট ভরে খাওয়ানো।' },
    { c: 'রোজা', q: 'কোন কাজে রোজা ভাঙে না?',
      a: 'ভুলে কিছু খেলে বা পান করলে (মনে পড়ামাত্র বন্ধ করুন)।\nমিসওয়াক বা ব্রাশ করলে (গলায় কিছু না গেলে)।\nনিজে নিজে বমি এলে।\nস্বপ্নদোষ হলে।\nসুরমা বা তেল ব্যবহার করলে।\nগোসল করলে বা কুলি করলে, যদি পানি গলায় না যায়।' },
    { c: 'রোজা', q: 'অসুস্থ বা সফরে থাকলে রোজার বিধান কী?',
      a: 'রোজা রাখলে রোগ বাড়ার আশঙ্কা থাকলে বা সফরে কষ্ট হলে রোজা ছেড়ে পরে কাযা করা যায়। সফরে কষ্ট না হলে রোজা রাখাই উত্তম।' },
    { c: 'রোজা', q: 'ফিদিয়া কখন দিতে হয়?',
      a: 'অতি বৃদ্ধ বা এমন রোগী, যিনি ভবিষ্যতেও রোজা রাখতে পারবেন না, তিনি প্রতিটি রোজার বদলে একজন মিসকিনকে দুই বেলা খাওয়াবেন বা সদকায়ে ফিতরের সমপরিমাণ টাকা দেবেন। পরে সুস্থ হয়ে গেলে রোজা কাযা করতে হবে।' },
    { c: 'রোজা', q: 'সদকায়ে ফিতর কার উপর, কখন ওয়াজিব?',
      a: 'ঈদুল ফিতরের দিন সুবহে সাদিক হওয়ার সময় যিনি সাহেবে নিসাব (যাকাতের নিসাব পরিমাণ সম্পদের মালিক), তিনি নিজের ও নাবালেগ সন্তানদের পক্ষ থেকে দেবেন।\nঈদের নামাজের আগে দিয়ে দেওয়া উত্তম। পরিমাণ (গম, আটা বা তার মূল্য) প্রতি বছর ইসলামিক ফাউন্ডেশন বা স্থানীয় আলেমগণ ঘোষণা করেন।' },

    /* যাকাত */
    { c: 'যাকাত', q: 'যাকাত কার উপর ফরজ এবং কত দিতে হয়?',
      a: 'যিনি সাহেবে নিসাব হবেন, অর্থাৎ নিজের প্রয়োজনের অতিরিক্ত ও ঋণ বাদ দিয়ে ৭.৫ ভরি (প্রায় ৮৭.৪৮ গ্রাম) সোনা, বা ৫২.৫ ভরি (প্রায় ৬১২.৩৬ গ্রাম) রুপা, বা সমমূল্যের টাকা-ব্যবসার মালের মালিক হবেন এবং তা এক চান্দ্র বছর তাঁর কাছে থাকবে।\nযাকাতের হার ২.৫% (৪০ ভাগের এক ভাগ)।\nনগদ টাকা ও ব্যবসার মালের নিসাব নির্ধারণে বর্তমানে অনেক আলেম রুপার নিসাবকে ভিত্তি ধরতে বলেন। নিজ এলাকার আলেমের সাথে পরামর্শ করুন।' },
    { c: 'যাকাত', q: 'যাকাত কাদেরকে দেওয়া যায়?',
      a: 'সূরা তাওবায় আট খাত উল্লেখ আছে: ফকির, মিসকিন, যাকাত আদায়ে নিযুক্ত কর্মী, ঋণগ্রস্ত, দাসমুক্তি, মুআল্লাফাতুল কুলূব (ইসলামের প্রতি আকৃষ্ট করার জন্য), আল্লাহর পথে (জিহাদ/দ্বীনি কাজ) এবং মুসাফির। অধিকাংশ হানাফি ফকীহের মতে মুআল্লাফাতুল কুলূব এখন প্রযোজ্য নয়।\nযাদের দেওয়া যায় না: নিজের মা-বাবা, দাদা-দাদি, সন্তান ও নাতি-নাতনি, স্বামী-স্ত্রী এবং নবী (সা.)-এর বংশধর (সাইয়্যেদ)। কোনো ধনী ব্যক্তিকেও দেওয়া যায় না।' },
    { c: 'যাকাত', q: 'যাকাতের টাকা মসজিদ বা মাদ্রাসার কাজে দেওয়া যায় কি?',
      a: 'যাকাত আদায় হতে হলে কোনো যোগ্য ব্যক্তিকে মালিক বানিয়ে দিতে হয়। তাই মসজিদ নির্মাণ, মেরামত, ইমাম-মুয়াজ্জিনের বেতন বা মসজিদের অন্যান্য খরচে যাকাত দেওয়া জায়েয নয়।\nমাদ্রাসার গরিব ও এতিম ছাত্রকে মালিক বানিয়ে দেওয়া যায়।\nমসজিদের খরচের জন্য সাধারণ দান ও সদকা (নফল) দেওয়া উচিত।' },

    /* জানাজা */
    { c: 'জানাজা', q: 'জানাজার নামাজের ফরজ ও পদ্ধতি কী?',
      a: 'জানাজা ফরজে কিফায়া: কিছু লোক আদায় করলে সবার পক্ষ থেকে আদায় হয়ে যায়।\nফরজ দুটি: ৪ তাকবীর বলা এবং দাঁড়িয়ে পড়া। এতে রুকু-সিজদা নেই।\nপদ্ধতি: নিয়ত করে প্রথম তাকবীরে কান পর্যন্ত হাত তুলে হাত বাঁধুন, সানা পড়ুন (শেষে “ওয়া জাল্লা সানাউকা” যোগ করুন)। দ্বিতীয় তাকবীরে (হাত না তুলে) দরূদ ইবরাহীম। তৃতীয় তাকবীরে মৃত ব্যক্তির জন্য দোয়া। চতুর্থ তাকবীরের পর ডানে ও বামে সালাম ফিরিয়ে হাত ছেড়ে দিন।\nদোয়াগুলো “দোয়া” পেজের “জানাজা ও কবর” অংশে আছে।' },
    { c: 'জানাজা', q: 'মৃত ব্যক্তির গোসল, কাফন ও দাফনের হুকুম কী?',
      a: 'মৃত মুসলিমকে গোসল দেওয়া, কাফন পরানো, জানাজা পড়া ও দাফন করা ফরজে কিফায়া। বিস্তারিত নিয়ম “বিশেষ বিষয়” অংশের “মৃত্যু ও কাফন-দাফন” পেজে দেখুন।' },
    { c: 'জানাজা', q: 'কবর যিয়ারত জায়েয কি?',
      a: 'হ্যাঁ, কবর যিয়ারত জায়েয ও মুস্তাহাব, কারণ তা মৃত্যু ও আখিরাতের কথা স্মরণ করিয়ে দেয়। কবরস্থানে গিয়ে সালাম দেওয়া, দোয়া করা ও কুরআন তিলাওয়াত করে সওয়াব পৌঁছানো যায়। কবরে সিজদা করা, কবরবাসীর কাছে কিছু চাওয়া বা কবর পাকা করে সাজানো জায়েয নয়।' },

    /* বিবিধ */
    { c: 'বিবিধ', q: 'কুরবানী কার উপর ওয়াজিব?',
      a: 'হানাফি মতে মুকীম, স্বাধীন, সাহেবে নিসাব (জিলহজ্জের ১০ থেকে ১২ তারিখের মধ্যে) প্রত্যেক মুসলিমের উপর কুরবানী ওয়াজিব।\nছাগল, ভেড়া ও দুম্বা একজনের পক্ষ থেকে একটি। গরু, মহিষ ও উটে সর্বোচ্চ সাত ভাগ।\nঈদের নামাজের পর কুরবানী করতে হয়। ১০, ১১ ও ১২ জিলহজ্জ কুরবানীর সময়।' },
    { c: 'বিবিধ', q: 'আকীকার বিধান কী?',
      a: 'সন্তান জন্মের পর শুকরিয়া হিসেবে আকীকা করা মুস্তাহাব। সপ্তম দিনে করা উত্তম। ছেলের জন্য দুটি এবং মেয়ের জন্য একটি ছাগল বা ভেড়া জবাই করা উত্তম। সপ্তম দিনে সম্ভব না হলে পরেও করা যায়। সন্তানের নাম রাখাও এ সময় ভালো।' },
    { c: 'বিবিধ', q: 'ছুটে যাওয়া নামাজের (কাযা) বিধান কী?',
      a: 'ফরজ ও ওয়াজিব (বিতর) নামাজ ছুটে গেলে সুযোগ পাওয়ামাত্র কাযা করা ফরজ। ইচ্ছা করে ছাড়লে গুনাহ হয়, তাই তাওবা করে কাযা আদায় করতে হবে। বিস্তারিত নিয়ম ও হিসাবের জন্য “কাযা নামাজ” পেজ দেখুন।' }
  ];

  var out = document.getElementById('out'), qEl = document.getElementById('q'), cnt = document.getElementById('cnt');
  var cur = 'সব', cats = [];

  function buildCats() {
    var seen = {}, list = [{ id: 'সব', n: 'সব' }];
    M.forEach(function (m) { if (!seen[m.c]) { seen[m.c] = 1; list.push({ id: m.c, n: m.c }); } });
    cats = list;
  }

  function show() {
    var q = qEl.value.trim().toLowerCase(), n = 0;
    out.textContent = '';
    M.forEach(function (m) {
      if (!q && cur !== 'সব' && m.c !== cur) return;
      if (q && (m.q + ' ' + m.a + ' ' + m.c).toLowerCase().indexOf(q) < 0) return;
      var d = h('details', 'acc');
      var sm = h('summary');
      var l = h('span', 'sum-t', m.q);
      l.appendChild(h('span', 'sum-s', m.c));
      sm.appendChild(l);
      d.appendChild(sm);
      var b = h('div', 'body');
      var p = h('p', '', m.a);
      p.style.whiteSpace = 'pre-line';
      b.appendChild(p);
      d.appendChild(b);
      out.appendChild(d); n++;
    });
    cnt.textContent = n ? bn(n) + 'টি মাসআলা' : '';
    if (!n) out.appendChild(h('p', 'empty', 'কিছু পাওয়া যায়নি। অন্য শব্দে খুঁজুন বা ইমাম সাহেবকে জিজ্ঞাসা করুন।'));
  }

  function draw() {
    buildCats();
    if (!cats.some(function (c) { return c.id === cur; })) cur = 'সব';
    EDU.chips(document.getElementById('chips'), cats, function (id) { cur = id; show(); }, cur);
  }

  draw();
  qEl.addEventListener('input', show);

  /* masala.json থেকে নতুন মাসআলা যোগ হয় (ফাইল না থাকলে বা ভুল হলে কিছু হয় না) */
  try {
    fetch('masala.json?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('no file'); return r.json(); })
      .then(function (j) {
        if (!Array.isArray(j)) return;
        var add = j.filter(function (x) { return x && typeof x.q === 'string' && typeof x.a === 'string' && x.q.trim() && x.a.trim(); })
          .map(function (x) { return { c: (typeof x.c === 'string' && x.c.trim()) ? x.c.trim() : 'বিবিধ', q: x.q.trim(), a: x.a.trim() }; });
        if (!add.length) return;
        M = M.concat(add);
        draw();
      })
      .catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
